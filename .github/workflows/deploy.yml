name: deploy
'on':
  workflow_dispatch: {}
jobs:
  validate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Stage 2a - Validate HTML (htmlhint)
      run: npm run validate:html
    - name: Stage 2b - Validate CSS (stylelint)
      run: npm run validate:css
    - name: Stage 2c - Validate JavaScript (node syntax check)
      run: npm run validate:js
  lint:
    runs-on: ubuntu-latest
    needs:
    - validate-assets
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Stage 3 - ESLint
      run: npm run lint
  unit-tests:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    outputs:
      coverage_pct: ${{ steps.coverage.outputs.coverage_pct }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Stage 4 - Jest unit tests
      run: npm test
    - id: coverage
      name: Stage 5 - Code coverage report
      run: npm run coverage:report
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
  secret-scan:
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Install Gitleaks
      run: 'GITLEAKS_VERSION=8.28.0

        mkdir -p "${HOME}/.local/bin"

        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        -o /tmp/gitleaks.tar.gz

        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

        install -m 0755 /tmp/gitleaks "${HOME}/.local/bin/gitleaks"

        "${HOME}/.local/bin/gitleaks" version

        '
    - name: Stage 6 - Gitleaks secret scanning
      run: "\"${HOME}/.local/bin/gitleaks\" detect --source . --config .gitleaks.toml\
        \ \\\n  --redact --verbose --exit-code 1\n"
  static-security:
    runs-on: ubuntu-latest
    needs:
    - secret-scan
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Semgrep
      run: 'python -m pip install --upgrade semgrep

        semgrep --version

        '
    - name: Stage 7 - Semgrep static security scan
      run: semgrep scan --config p/ci --config p/security-audit --error --metrics=off
        .
  docker-build:
    runs-on: ubuntu-latest
    needs:
    - static-security
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Stage 8 - Docker build
      run: docker build -t "devsecops-masterclass:${GITHUB_SHA}" -t devsecops-masterclass:ci
        .
    - name: Install Trivy
      run: "sudo apt-get update\nsudo apt-get install -y wget gnupg\nwget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key\
        \ \\\n  | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null\n\
        echo \"deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb\
        \ generic main\" \\\n  | sudo tee /etc/apt/sources.list.d/trivy.list\nsudo\
        \ apt-get update\nsudo apt-get install -y trivy\ntrivy --version\n"
    - name: Stage 9 - Container vulnerability scan (Trivy)
      run: "trivy image --severity HIGH,CRITICAL --ignore-unfixed \\\n  --exit-code\
        \ 1 --no-progress devsecops-masterclass:ci\n"
    - name: Export image tarball
      run: docker save devsecops-masterclass:ci -o image.tar
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar
        retention-days: 1
  terraform-checks:
    runs-on: ubuntu-latest
    needs:
    - docker-build
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Stage 10 - Terraform validate
      run: terraform validate -no-color
      working-directory: infra
    - name: Stage 11 - Terraform format check
      run: terraform fmt -check -recursive -diff
      working-directory: infra
    - name: Stage 12 - Terraform plan
      run: terraform plan -input=false -no-color -out=tfplan
      working-directory: infra
  provision:
    runs-on: ubuntu-latest
    needs:
    - terraform-checks
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 30
    outputs:
      public_ip: ${{ steps.tfout.outputs.public_ip }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Stage 13 - Terraform apply
      run: terraform apply -input=false -auto-approve -no-color
      working-directory: infra
    - id: tfout
      name: Export instance IP
      run: 'IP="$(terraform output -raw public_ip)"

        echo "public_ip=${IP}" >> "$GITHUB_OUTPUT"

        '
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      APP_HOST: ${{ needs.provision.outputs.public_ip }}
      SSH_USER: ${{ secrets.SSH_USER }}
      IMAGE_NAME: devsecops-masterclass
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Ansible
      run: 'python -m pip install --upgrade ansible-core

        ansible --version

        '
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    - name: Stage 14 - SSH into EC2 (write key, trust host, wait for sshd)
      run: "mkdir -p ~/.ssh\nprintf '%s\\n' \"$SSH_KEY\" > ~/.ssh/deploy_key\nchmod\
        \ 600 ~/.ssh/deploy_key\nfor i in $(seq 1 20); do\n  if ssh-keyscan -T 10\
        \ -H \"$APP_HOST\" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts\
        \ ]; then\n    break\n  fi\n  echo \"waiting for sshd on $APP_HOST ($i/20)\"\
        \n  sleep 15\ndone\nssh -i ~/.ssh/deploy_key -o BatchMode=yes \"${SSH_USER}@${APP_HOST}\"\
        \ 'echo SSH OK; uname -a'\n"
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Generate inventory
      run: "mkdir -p ansible\nprintf '[web]\\n%s ansible_user=%s ansible_ssh_private_key_file=%s\\\
        n' \\\n  \"$APP_HOST\" \"$SSH_USER\" \"$HOME/.ssh/deploy_key\" > ansible/inventory.ini\n\
        cat ansible/inventory.ini\n"
    - name: Stages 15-17 - Install Docker, deploy container, configure Nginx
      run: "ansible-playbook -i ansible/inventory.ini ansible/site.yml \\\n  -e \"\
        image_tarball=${GITHUB_WORKSPACE}/image.tar\" \\\n  -e \"image_name=${IMAGE_NAME}\"\
        \ \\\n  -e \"image_tag=ci\"\n"
      env:
        ANSIBLE_HOST_KEY_CHECKING: 'False'
  verify:
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      APP_HOST: ${{ needs.provision.outputs.public_ip }}
      COVERAGE_PCT: ${{ needs.unit-tests.outputs.coverage_pct }}
      IMAGE_NAME: devsecops-masterclass
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Stage 18 - Smoke test (landing page content)
      run: "curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors\
        \ \\\n  \"http://${APP_HOST}/\" -o /tmp/index.html\ngrep -q \"Learn DevOps\
        \ the Easy Way\" /tmp/index.html\necho \"smoke test passed: landing page served\"\
        \n"
    - name: Stage 19 - Health check endpoint
      run: "curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors\
        \ \\\n  \"http://${APP_HOST}/healthz\" -o /tmp/health.txt\ncat /tmp/health.txt\n"
    - name: Stage 20 - Deployment summary
      run: bash scripts/deployment_summary.sh
