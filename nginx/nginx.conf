# Main nginx configuration for the unprivileged container image.
# Runs as the pre-existing `nginx` user with a writable-by-nginx pid path,
# so the container needs no root privileges (CIS Docker 4.1).

worker_processes auto;
pid              /tmp/nginx.pid;

# Logs go to the container's stdout/stderr (twelve-factor XI), NOT to files.
# A file-based log under /var/log/nginx breaks the moment that path is a
# fresh root-owned tmpfs (as it is with --read-only --tmpfs /var/log/nginx),
# because nginx runs as the unprivileged `nginx` user and cannot create it:
#   nginx: [emerg] open() "/var/log/nginx/error.log" failed (13: Permission denied)
# Streaming to stdio also makes `docker logs` the single source of truth.
error_log  /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp paths under /tmp so the root filesystem can stay read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format  main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 1m;

    include /etc/nginx/conf.d/*.conf;
}
