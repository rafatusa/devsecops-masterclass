# Nginx vhost for the DevSecOps Masterclass static site (inside the container).
#
# NOTE ON add_header: nginx does NOT inherit add_header directives into a
# location block that declares its own. Every location that sets a header must
# therefore restate the security headers, or those requests are served without
# them. Semgrep's generic.nginx.security.header-redefinition rule catches this.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Stage 19: Health Check target.
    location = /healthz {
        access_log off;
        default_type text/plain;

        add_header X-Content-Type-Options "nosniff"                        always;
        add_header X-Frame-Options        "SAMEORIGIN"                     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        return 200 "ok\n";
    }

    # Static assets: cached, and carrying the same security headers.
    location ~* \.(?:css|js|svg|woff2?)$ {
        add_header X-Content-Type-Options "nosniff"                        always;
        add_header X-Frame-Options        "SAMEORIGIN"                     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control          "public, max-age=3600"           always;

        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff"                        always;
        add_header X-Frame-Options        "SAMEORIGIN"                     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        try_files $uri $uri/ /index.html;
    }
}
